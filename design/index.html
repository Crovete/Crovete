<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Crovete Design Tool</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#111}
.app{max-width:900px;margin:auto;padding:14px}
.controls{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:10px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input[type=text],input[type=tel],select{
 width:100%;height:44px;border:1px solid #ccc;border-radius:8px;padding:0 12px;
 font-size:16px;background:#fff
}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uploadBtn{
 height:46px;border:1px dashed #999;border-radius:8px;background:#fafafa;
 display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer
}
.uploadBtn input{display:none}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.color{
 width:38px;height:38px;border-radius:50%;border:2px solid #ddd;cursor:pointer;
 position:relative
}
.color.active{outline:3px solid #111;outline-offset:2px}
.color{background:#ddd}
.color[data-c="Black"]{background:#111}
.color[data-c="Green"]{background:#218b5a}
.color[data-c="Grey"]{background:#8b8b8b}
.color[data-c="Melange Grey"]{background:#aaa}
.color[data-c="Navy Blue"]{background:#172b4d}
.color[data-c="Olive Green"]{background:#667238}
.color[data-c="Red"]{background:#d71920}
.color[data-c="Royal Blue"]{background:#2459b8}
.color[data-c="White"]{background:#fff}
.color[data-c="Yellow"]{background:#f2c500}
.color[data-c="Lavender"]{background:#b8a6d9}
.color[data-c="Light Grey"]{background:#c9c9c9}
.color[data-c="Mint Green"]{background:#9ed8bd}
.color[data-c="Ocean Blue"]{background:#267fa5}
.color[data-c="Parrot Green"]{background:#78b83e}
.color[data-c="Acid Wash"]{background:#9a9994}
.color[data-c="Beige"]{background:#d9c5a1}
.color[data-c="Coffee"]{background:#70503c}

.typeRow{display:flex;gap:8px;flex-wrap:wrap}
.typeBtn{
 min-height:42px;padding:0 14px;border:1px solid #ccc;background:#fff;border-radius:7px;
 font-weight:700;cursor:pointer;font-size:14px
}
.typeBtn.active{background:#111;color:#fff;border-color:#111}
.sizeRow{display:flex;gap:7px;flex-wrap:wrap}
.sizeBtn{
 min-width:54px;height:40px;border:1px solid #ccc;background:#fff;border-radius:7px;
 font-weight:700;cursor:pointer
}
.sizeBtn.active{background:#111;color:#fff;border-color:#111}
.stageWrap{background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px}
.stage{
 position:relative;width:100%;aspect-ratio:1536/1024;overflow:hidden;border-radius:8px;
 background:#eee;touch-action:pan-y
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.design{
 position:absolute;user-select:none;-webkit-user-select:none;touch-action:pan-y !important;cursor:move;display:none;
 transform-origin:center center;z-index:10
}
.design img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.handle{
 position:absolute;right:-14px;bottom:-14px;width:30px;height:30px;border-radius:50%;
 background:#111;border:3px solid #fff;cursor:nwse-resize;touch-action:pan-y !important;z-index:20
}
.design.selected{outline:1px dashed #111}
.hint{font-size:12px;color:#666;text-align:center;margin:7px 0 0}
.actions{margin-top:16px;padding:4px 0 14px;display:block;clear:both}
.actions .primary{display:block;min-height:52px;width:100%;font-size:18px;font-weight:800}
.actions .status{min-height:20px}
button.primary{
 width:100%;height:50px;border:0;border-radius:9px;background:#111;color:#fff;
 font-size:17px;font-weight:800;cursor:pointer
}
button.primary:disabled{opacity:.5;cursor:not-allowed}
.whatsapp{background:#168c3b!important;color:#fff!important}
.status{font-size:13px;margin-top:8px;text-align:center;color:#555;min-height:18px}
@media(max-width:600px){
 .row,.uploads{grid-template-columns:1fr}
 .app{padding:8px}
}
</style>
</head>
<body>
<div class="app">
  <div id="toolTitle" style="font-size:22px;font-weight:900;margin:2px 0 14px;text-align:center;">Crovete Design Tool</div>
  <div class="controls">
    <div class="uploads">
      <label class="uploadBtn">Upload Front Design
        <input id="frontFile" type="file" accept="image/*">
      </label>
      <label class="uploadBtn">Upload Back Design
        <input id="backFile" type="file" accept="image/*">
      </label>
    </div>


    <div class="field">
      <label>Type</label>
      <div class="typeRow" id="types">
        <button type="button" class="typeBtn active">Regular</button>
        <button type="button" class="typeBtn">Oversized Eco</button>
        <button type="button" class="typeBtn">Oversized Premium</button>
      </div>
    </div>

    <div class="field" style="margin-top:12px">
      <label>T-Shirt Color</label>
      <div class="colors" id="colors" aria-label="Available colors"></div>
    </div>

    <div class="field">
      <label>Size</label>
      <div class="sizeRow" id="sizes">
        <button type="button" class="sizeBtn active">S</button>
        <button type="button" class="sizeBtn">M</button>
        <button type="button" class="sizeBtn">L</button>
        <button type="button" class="sizeBtn">XL</button>
        <button type="button" class="sizeBtn">XXL</button>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter name">
      </div>
      <div class="field">
        <label for="mobile">Mobile Number</label>
        <input id="mobile" type="tel" inputmode="numeric" placeholder="Enter mobile number">
      </div>
    </div>

    <div class="field">
      <label for="supportName">Design Support Name</label>
      <input id="supportName" type="text" value="Not applicable" placeholder="Enter design support name">
    </div>

    <div class="field">
      <label for="supportMobile">Design Support Contact Number</label>
      <input id="supportMobile" type="tel" inputmode="numeric" value="Not applicable" placeholder="Enter design support contact number">
    </div>

    <div class="field">
      <label for="deliveryLocation">Location of Delivery</label>
      <input id="deliveryLocation" type="text" placeholder="Enter delivery location">
    </div>
  </div>

  <div class="stageWrap">
    <div class="stage" id="stage">
      <canvas id="mockup"></canvas>
      <div class="design" id="frontDesign"><img alt="Front design"><div class="handle"></div></div>
      <div class="design" id="backDesign"><img alt="Back design"><div class="handle"></div></div>
    </div>
    <div class="hint">Touch/drag the design to move it anywhere. Touch/drag the black corner to resize freely.</div>
  </div>

  <div class="actions" id="shareActions">
    <button id="shareBtn" class="primary whatsapp" type="button">Share on WhatsApp</button>
    <div id="status" class="status" aria-live="polite"></div>
  </div>
</div>

function colorKey(name){

function renderColors(){
  const box=document.getElementById("colors");

  // Keep the selected color valid for the selected type.
  if(!list.includes(currentColor)) currentColor=list.includes("White") ? "White" : list[0];

  list.forEach(name=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="color"+(name===currentColor ? " active" : "");
    b.dataset.c=name;
    b.setAttribute("aria-label",name);
    b.title=name;
    box.appendChild(b);
  });
}

function polyPath(c, pts){
  c.beginPath();
  pts.forEach((p,i)=> i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]));
  c.closePath();
}

function pointInPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
    const hit=((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(hit) inside=!inside;
  }
  return inside;
}


function renderMockup(){
  if(!mockupImg.complete) return;
  canvas.width=W;
  canvas.height=H;
  ctx.clearRect(0,0,W,H);
  // IMPORTANT: Never recolor/tint the supplied mockup.
  ctx.drawImage(mockupImg,0,0,W,H);
  stage.style.aspectRatio=W+"/"+H;
  updateDesignDOM("front");
  updateDesignDOM("back");
}

function switchMockupForType(){
  const info=mockupInfo[currentType] || mockupInfo["Regular"];
  W=info.w; H=info.h;
  mockupImg=new Image();
  mockupImg.onload=renderMockup;
  mockupImg.src=info.src;

  // When changing between mockup formats, keep designs usable and
  // reposition them to the corresponding shirt centers if they already exist.
  ["front","back"].forEach(side=>{
    const a=info[side];
    if(state[side].visible){
      state[side].x=a.x+a.w/2;
      state[side].y=a.y+a.h*0.38;
      updateDesignDOM(side);
    }
  });
}

function updateDesignDOM(side){
  const el=side==="front"?frontEl:backEl, s=state[side];
  if(!s.visible){el.style.display="none";return;}
  el.style.display="block";
  el.style.left=(s.x-s.w/2)/W*100+"%";
  el.style.top=(s.y-s.h/2)/H*100+"%";
  el.style.width=s.w/W*100+"%";
  el.style.height=s.h/H*100+"%";
}

function setStatus(msg){statusEl.textContent=msg||""}

function loadDesign(side,file){
  if(!file || !file.type.startsWith("image/")) return;
  const reader=new FileReader();
  reader.onload=function(){
    const img=new Image();
    img.onload=function(){
      const a=(mockupInfo[currentType] || mockupInfo["Regular"])[side];
      const ratio=Math.min(300/img.width,220/img.height,1);
      state[side].src=reader.result;
      state[side].w=Math.max(40,img.width*ratio);
      state[side].h=Math.max(40,img.height*ratio);
      state[side].x=a.x+a.w/2; state[side].y=a.y+a.h*0.38;
      state[side].visible=true;
      const el=side==="front"?frontEl:backEl;
      el.querySelector("img").src=reader.result;
      activeDesign=side;
      updateDesignDOM(side);
      selectDesign(side);
      setStatus((side==="front"?"Front":"Back")+" design uploaded.");
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function selectDesign(side){
  activeDesign=side;
  frontEl.classList.toggle("selected",side==="front");
  backEl.classList.toggle("selected",side==="back");
}

function setupDrag(el,side){
  let mode=null, startX=0, startY=0, start={}, active=false, pointerType="";

  el.addEventListener("pointerdown",e=>{
    if(e.button!==undefined && e.button!==0 && e.pointerType!=="touch") return;

    mode=e.target.classList.contains("handle") ? "resize" : "move";
    selectDesign(side);
    pointerType=e.pointerType || "mouse";
    active=false;
    startX=e.clientX;
    startY=e.clientY;
    start={
      x:state[side].x,
      y:state[side].y,
      w:state[side].w,
      h:state[side].h
    };

    // Do not preventDefault here: this is what allows the page to scroll
    // naturally on phones after selecting a design.
  });

  el.addEventListener("pointermove",e=>{
    if(!mode) return;

    const dxScreen=e.clientX-startX;
    const dyScreen=e.clientY-startY;
    const distance=Math.hypot(dxScreen,dyScreen);

    // Small movements are treated as scrolling/normal touch interaction.
    if(!active){
      if(distance<8) return;
      active=true;
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
    }

    const r=stage.getBoundingClientRect();
    const dx=dxScreen*W/r.width;
    const dy=dyScreen*H/r.height;

    if(mode==="move"){
      state[side].x=start.x+dx;
      state[side].y=start.y+dy;
    }else{
      const ratio=start.w/start.h || 1;
      state[side].w=Math.max(20,start.w+dx*2);
      state[side].h=Math.max(20,state[side].w/ratio);
    }

    updateDesignDOM(side);

    // Once the user has clearly started manipulating the design,
    // stop the browser from scrolling.
    if(active) e.preventDefault();
  });

  const end=()=>{
    mode=null;
    active=false;
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}
setupDrag(frontEl,"front"); setupDrag(backEl,"back");

function drawDesignOnCanvas(c,side){
  const s=state[side]; if(!s.visible)return Promise.resolve();
  return new Promise(resolve=>{
    const im=new Image();
    im.onload=()=>{
      c.drawImage(im,s.x-s.w/2,s.y-s.h/2,s.w,s.h);
      resolve();
    };
    im.onerror=()=>resolve();
    im.src=s.src;
  });
}

function polygonBounds(poly){
  const xs=poly.map(p=>p[0]), ys=poly.map(p=>p[1]);
  return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
}

async function makeShareImage(){
  const out=document.createElement("canvas");
  out.width=W; out.height=H+600;
  const o=out.getContext("2d");
  o.fillStyle="#fff"; o.fillRect(0,0,out.width,out.height);

  o.fillStyle="#111";
  o.font="900 42px Arial";
  o.fillText("T-SHIRT ORDER",55,58);

  // Capture the order date/time when the final image is generated.
  const orderNow = new Date();
  const orderDate = orderNow.toLocaleDateString("en-IN", {
    day:"2-digit", month:"2-digit", year:"numeric"
  });
  const orderTime = orderNow.toLocaleTimeString("en-IN", {
    hour:"2-digit", minute:"2-digit", hour12:true
  });

  o.font="700 25px Arial";
  o.fillText("DATE: "+orderDate+"   TIME: "+orderTime,55,88);

  o.font="700 27px Arial";
  const nm=(nameEl.value||"").trim() || "-";
  const mob=(mobileEl.value||"").trim() || "-";
  // Top of final image: basic order information.
  o.fillText("NAME: "+nm.toUpperCase(),55,130);
  o.fillText("MOBILE: "+mob,55,167);
  o.fillText("TYPE: "+currentType.toUpperCase(),55,204);
  o.fillText("COLOR: "+currentColor.toUpperCase()+"   SIZE: "+currentSize,55,241);

  // Keep the supplied mockup exactly as provided; selected color is order metadata only.
  const preview=document.createElement("canvas");
  preview.width=W; preview.height=H;
  const p=preview.getContext("2d");
  p.drawImage(canvas,0,0,W,H);
  await drawDesignOnCanvas(p,"front");
  await drawDesignOnCanvas(p,"back");
  o.drawImage(preview,0,285,W,H);

  // Extra requested details are always placed at the bottom of the final image.
  const supportName=(supportNameEl.value||"").trim() || "Not applicable";
  const supportMobile=(supportMobileEl.value||"").trim() || "Not applicable";
  const delivery=(deliveryLocationEl.value||"").trim() || "Not applicable";

  const bottomY=H+330;
  o.fillStyle="#111";
  o.font="900 30px Arial";
  o.fillText("ORDER DETAILS",55,bottomY);

  o.font="700 25px Arial";
  o.fillText("DESIGN SUPPORT NAME: "+supportName.toUpperCase(),55,bottomY+48);
  o.fillText("DESIGN SUPPORT CONTACT NUMBER: "+supportMobile.toUpperCase(),55,bottomY+88);
  o.fillText("LOCATION OF DELIVERY: "+delivery.toUpperCase(),55,bottomY+128);

  // Crovete.com watermark at the extreme right bottom of the final image.
  o.textAlign="right";
  o.font="700 24px Arial";
  o.fillText("Crovete.com",W-28,out.height-24);
  o.textAlign="left";

  return new Promise(resolve=>out.toBlob(resolve,"image/png",1));
}

shareBtn.addEventListener("click",async()=>{
  const name=(nameEl.value||"").trim(), mobile=(mobileEl.value||"").trim();
  if(!name){setStatus("Please enter name."); nameEl.focus(); return;}
  if(!mobile){setStatus("Please enter mobile number."); mobileEl.focus(); return;}
  setStatus("Creating image...");
  shareBtn.disabled=true;
  try{
    const blob=await makeShareImage();
    const file=new File([blob],"tshirt-order.png",{type:"image/png"});
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({
        title:"T-Shirt Order",
        text:"T-Shirt order",
        files:[file]
      });
      setStatus("Share sheet opened. Select WhatsApp.");
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="tshirt-order.png"; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      const text=encodeURIComponent("T-Shirt Order - "+name+" | "+mobile+" | "+currentColor.toUpperCase()+" | Size "+currentSize);
      window.open("https://wa.me/?text="+text,"_blank","noopener");
      setStatus("Image saved. Attach the saved image in WhatsApp.");
    }
  }catch(err){
    if(err && err.name==="AbortError") setStatus("Share cancelled.");
    else setStatus("Could not share. Please try again.");
  }finally{shareBtn.disabled=false;}
});
